<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จ่ายแผ่นลูกฟูก WIP → ฝ่ายผลิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#c9a370;
    --kraft-dark:#7a5a37;
    --ink:#2b2118;
    --paper:#faf6ec;
    --blue:#1e5f74;
    --blue-dark:#153f4d;
    --green:#1f8a56;
    --green-dark:#146339;
    --red:#c0392b;
    --red-dark:#8e2a20;
    --amber:#c9860f;
  }
  html{font-size:19px;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--kraft);
    color:var(--ink);
    min-height:100vh;
    background-image:
      repeating-linear-gradient(135deg, rgba(122,90,55,0.10) 0 3px, transparent 3px 14px);
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 16px 14px;
    border-bottom:6px solid var(--kraft-dark);
  }
  header h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:.02em;
    margin:0 0 2px;
    line-height:1.1;
  }
  header p{margin:0;font-size:.8rem;color:#d8c8ab;}
  .tabs{
    display:flex;
    gap:0;
    margin:14px 12px 0;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:12px 8px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:.03em;
    background:var(--paper);
    color:var(--kraft-dark);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .tab.active{background:var(--ink);color:var(--paper);}
  .tab:first-child{border-radius:6px 0 0 6px;border-right:none;}
  .tab:last-child{border-radius:0 6px 6px 0;}
  .tab:first-child.active{border-right:2px solid var(--ink);}
  main{padding:16px 12px 60px;max-width:520px;margin:0 auto;}
  .card{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:4px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:4px 4px 0 var(--kraft-dark);
  }
  .card h2{
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:2px dashed var(--kraft-dark);
  }
  label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--kraft-dark);
    margin:10px 0 4px;
  }
  input,select{
    width:100%;
    padding:11px 10px;
    font-size:1rem;
    font-family:'Inter',sans-serif;
    border:1.5px solid #b8a888;
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;}
  button{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:1.1rem;
    letter-spacing:.02em;
    border:none;
    border-radius:4px;
    padding:13px 16px;
    cursor:pointer;
    width:100%;
    margin-top:14px;
    color:#fff;
  }
  .btn-blue{background:var(--blue);}
  .btn-blue:active{background:var(--blue-dark);}
  .btn-green{background:var(--green);}
  .btn-green:active{background:var(--green-dark);}
  .btn-red{background:var(--red);}
  .btn-secondary{background:transparent;color:var(--ink);border:2px solid var(--ink);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .msg{
    font-size:.85rem;
    padding:9px 10px;
    border-radius:4px;
    margin-top:10px;
  }
  .msg.ok{background:#e2f3e9;color:var(--green-dark);border:1px solid var(--green);}
  .msg.err{background:#fbe6e3;color:var(--red-dark);border:1px solid var(--red);}
  .open-list{margin-top:6px;}
  .open-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0 2px;
    font-size:.88rem;
  }
  .open-item-block{
    padding:8px 0;
    border-bottom:1px solid #e2d6bd;
  }
  .open-item-block:last-child{border-bottom:none;}
  .open-item .tag{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    background:var(--ink);
    color:var(--paper);
    padding:2px 8px;
    border-radius:3px;
    font-size:.78rem;
  }
  .ticket{
    border:2px solid var(--ink);
    border-radius:4px;
    padding:14px;
    margin-top:4px;
    background:#fff;
    position:relative;
  }
  .ticket::before{
    content:"PICKING";
    position:absolute;
    top:-11px;left:12px;
    background:var(--paper);
    padding:0 6px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.12em;
    color:var(--kraft-dark);
  }
  .ticket .row{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem;}
  .ticket .row span:first-child{color:#7a6a4e;}
  .ticket .row span:last-child{font-weight:600;}
  .ticket .so-big{
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:.03em;
    margin:6px 0 2px;
  }
  .progress-track{
    height:10px;background:#e5dcc6;border-radius:6px;overflow:hidden;margin-top:6px;
  }
  .progress-fill{height:100%;background:var(--blue);}
  .result-banner{
    text-align:center;
    padding:22px 12px;
    border-radius:6px;
    margin-top:14px;
    font-family:'Barlow Condensed',sans-serif;
  }
  .result-banner.pass{background:var(--green);color:#fff;}
  .result-banner.fail{background:var(--red);color:#fff;}
  .result-banner .big{font-size:2rem;font-weight:700;margin-bottom:2px;}
  .result-banner .small{font-size:.95rem;}
  .hidden{display:none !important;}
  .camera-preview{width:100%;border-radius:4px;border:2px solid var(--ink);margin-top:8px;}
  .spinner{
    display:inline-block;width:16px;height:16px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;
    animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .field-note{font-size:.8rem;color:#8a7a5c;margin-top:4px;}
  .remain-badge{
    margin-top:8px;
    padding:8px 10px;
    border-radius:4px;
    font-weight:700;
    font-size:.95rem;
    text-align:center;
  }
  .remain-badge.remain-short{background:#fdf1dc;color:#8a5a06;border:1.5px solid var(--amber);}
  .remain-badge.remain-done{background:#e2f3e9;color:var(--green-dark);border:1.5px solid var(--green);}
</style>
</head>
<body>

<header>
  <h1>จ่ายแผ่นลูกฟูก WIP → ฝ่ายผลิต</h1>
  <p>คลัง WIP · ระบบเปิด Picking และตรวจสอบการจ่ายด้วย AI อ่านป้าย</p>
</header>

<div class="tabs">
  <div class="tab active" id="tabSupervisor" onclick="switchTab('supervisor')">หัวหน้างาน</div>
  <div class="tab" id="tabStaff" onclick="switchTab('staff')">พนักงานจ่าย</div>
</div>

<main>

  <!-- ===================== SUPERVISOR VIEW ===================== -->
  <section id="viewSupervisor">
    <div class="card">
      <h2>เปิด Picking ใหม่</h2>
      <label>วันที่ผลิต</label>
      <input type="date" id="pProdDate">

      <label>เครื่องพิมพ์</label>
      <select id="pPrinter"><option value="">— เลือกเครื่องพิมพ์ —</option></select>

      <label>เลขที่ SO</label>
      <input type="text" id="pSO" placeholder="เช่น BA26081546">

      <label>ชื่อลูกค้า</label>
      <input type="text" id="pCustomer" placeholder="ชื่อลูกค้าตามใบสั่งผลิต">

      <label>จำนวนที่ต้องผลิต</label>
      <input type="number" id="pQty" placeholder="เช่น 1000">

      <label>ผู้เปิด Picking</label>
      <input type="text" id="pOpenedBy" placeholder="ชื่อหัวหน้างาน">

      <button class="btn-blue" onclick="createPicking()" id="btnCreatePicking">เปิด Picking</button>
      <div id="createMsg"></div>
    </div>

    <div class="card">
      <h2>Picking ที่เปิดอยู่</h2>
      <div class="open-list" id="openList">
        <p class="field-note">กำลังโหลด...</p>
      </div>
    </div>
  </section>

  <!-- ===================== STAFF VIEW ===================== -->
  <section id="viewStaff" class="hidden">
    <div class="card">
      <h2>ค้นหา Picking</h2>
      <label>เครื่องพิมพ์</label>
      <select id="sPrinter"><option value="">— เลือกเครื่องพิมพ์ —</option></select>

      <label>วันที่ผลิต</label>
      <input type="date" id="sDate">

      <button class="btn-blue" onclick="findPicking()" id="btnFind">ค้นหา Picking</button>
      <div id="findMsg"></div>

      <div id="pickingTicket" class="hidden"></div>
    </div>

    <div class="card hidden" id="scanCard">
      <h2>สแกนป้ายก่อนจ่าย</h2>
      <label>ชื่อพนักงาน</label>
      <input type="text" id="sStaffName" placeholder="ชื่อผู้จัดจ่าย">

      <input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden" onchange="onPhotoSelected(event)">
      <button class="btn-blue" onclick="document.getElementById('photoInput').click()" id="btnScan">📷 ถ่ายรูปป้าย</button>

      <img id="preview" class="camera-preview hidden">
      <div id="scanMsg"></div>
      <div id="resultArea"></div>
    </div>
  </section>

</main>

<script>
/* ตั้งค่า URL ของ Google Apps Script Web App ที่ deploy ไว้ */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwhWsqiOFtIpq5K0KTXoN0kLkVpFGEL5In6BKIHzmv3Dp27CaEfMcwKa1eGpBR0Tsw/exec';

let currentPicking = null;

function switchTab(tab){
  document.getElementById('tabSupervisor').classList.toggle('active', tab==='supervisor');
  document.getElementById('tabStaff').classList.toggle('active', tab==='staff');
  document.getElementById('viewSupervisor').classList.toggle('hidden', tab!=='supervisor');
  document.getElementById('viewStaff').classList.toggle('hidden', tab!=='staff');
}

async function apiGet(params){
  const url = WEBAPP_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'}, // หลีกเลี่ยง CORS preflight กับ Apps Script
    body: JSON.stringify(body)
  });
  return res.json();
}

function showMsg(elId, text, ok){
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`;
}

async function loadPrinters(){
  try{
    const data = await apiGet({action:'getPrinters'});
    const printers = data.printers || [];
    for(const sel of [document.getElementById('pPrinter'), document.getElementById('sPrinter')]){
      for(const p of printers){
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      }
    }
  }catch(e){ console.error(e); }
}

async function loadOpenPickings(){
  const list = document.getElementById('openList');
  try{
    const data = await apiGet({action:'getOpenPickings'});
    const items = data.pickings || [];
    if(!items.length){ list.innerHTML = '<p class="field-note">ยังไม่มี Picking ที่เปิดอยู่</p>'; return; }
    list.innerHTML = items.map(p => {
      const pct = p.plannedQty > 0 ? Math.round((p.dispatchedQty / p.plannedQty) * 100) : 0;
      const complete = p.dispatchedQty >= p.plannedQty;
      const barColor = complete ? 'var(--green)' : 'var(--amber)';
      return `
      <div class="open-item-block">
        <div class="open-item">
          <span>${p.printer} · ${p.productionDate} · ${p.so}</span>
          <span class="tag">${p.dispatchedQty} / ${p.plannedQty}</span>
        </div>
        <div class="progress-track" style="margin:2px 0 8px;">
          <div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${barColor};"></div>
        </div>
        <button class="btn-secondary" style="margin-top:0;font-size:.95rem;padding:9px;"
          onclick="confirmClosePicking('${p.pickingId}','${p.printer}','${p.so}',${p.dispatchedQty},${p.plannedQty})">
          ปิดงาน Picking นี้
        </button>
      </div>
    `;
    }).join('');
  }catch(e){
    list.innerHTML = '<p class="field-note">โหลดรายการไม่สำเร็จ ตรวจสอบ WEBAPP_URL</p>';
  }
}

async function confirmClosePicking(pickingId, printer, so, dispatchedQty, plannedQty){
  const complete = dispatchedQty >= plannedQty;
  const statusLine = complete
    ? `จ่ายครบแล้ว (${dispatchedQty}/${plannedQty})`
    : `⚠️ ยังจ่ายไม่ครบ (${dispatchedQty}/${plannedQty}) — ขาดอีก ${plannedQty - dispatchedQty}`;
  const msg = `ตรวจสอบก่อนปิดงาน\n\nเครื่องพิมพ์ ${printer} · SO ${so}\n${statusLine}\n\nยืนยันปิด Picking นี้หรือไม่?`;
  if(!window.confirm(msg)) return;
  try{
    await apiPost({ action:'closePicking', pickingId });
    loadOpenPickings();
  }catch(e){
    alert('ปิดงานไม่สำเร็จ: ' + e.message);
  }
}

async function createPicking(){
  const btn = document.getElementById('btnCreatePicking');
  const body = {
    action:'createPicking',
    productionDate: document.getElementById('pProdDate').value,
    printer: document.getElementById('pPrinter').value,
    so: document.getElementById('pSO').value,
    customer: document.getElementById('pCustomer').value,
    plannedQty: document.getElementById('pQty').value,
    openedBy: document.getElementById('pOpenedBy').value
  };
  if(!body.productionDate || !body.printer || !body.so || !body.customer || !body.plannedQty){
    showMsg('createMsg', 'กรอกข้อมูลให้ครบก่อนเปิด Picking', false); return;
  }
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    const res = await apiPost(body);
    if(res.success){
      showMsg('createMsg', `เปิด Picking สำเร็จ (${res.pickingId})`, true);
      document.getElementById('pSO').value='';
      document.getElementById('pCustomer').value='';
      document.getElementById('pQty').value='';
      loadOpenPickings();
    }else{
      showMsg('createMsg', res.error || 'บันทึกไม่สำเร็จ', false);
    }
  }catch(e){
    showMsg('createMsg', 'เชื่อมต่อไม่สำเร็จ: ' + e.message, false);
  }
  btn.disabled = false; btn.textContent = 'เปิด Picking';
}

let matchingPickings = [];

async function findPicking(){
  const printer = document.getElementById('sPrinter').value;
  const date = document.getElementById('sDate').value;
  const ticket = document.getElementById('pickingTicket');
  const scanCard = document.getElementById('scanCard');
  if(!printer || !date){ showMsg('findMsg','เลือกเครื่องพิมพ์และวันที่ก่อน', false); return; }
  document.getElementById('findMsg').innerHTML = '';
  currentPicking = null;
  ticket.classList.add('hidden');
  scanCard.classList.add('hidden');
  try{
    const data = await apiGet({action:'getPickingForPrinterDate', printer, date});
    matchingPickings = data.pickings || [];
    if(!matchingPickings.length){
      ticket.innerHTML = '';
      showMsg('findMsg', 'ไม่พบ Picking ที่เปิดไว้สำหรับเครื่องพิมพ์และวันที่นี้', false);
      return;
    }
    renderPickingChoices();
  }catch(e){
    showMsg('findMsg', 'เชื่อมต่อไม่สำเร็จ: ' + e.message, false);
  }
}

function remainingBadge(dispatchedQty, plannedQty){
  const remaining = plannedQty - dispatchedQty;
  if(remaining <= 0){
    return `<div class="remain-badge remain-done">✅ ครบแล้ว${remaining < 0 ? ' (เกิน ' + Math.abs(remaining) + ')' : ''}</div>`;
  }
  return `<div class="remain-badge remain-short">⚠️ ยังขาดอีก ${remaining.toLocaleString()}</div>`;
}

function renderPickingChoices(){
  const ticket = document.getElementById('pickingTicket');
  const scanCard = document.getElementById('scanCard');
  scanCard.classList.add('hidden');
  currentPicking = null;

  ticket.innerHTML = `
    <p class="field-note" style="margin:8px 0 6px;">พบ ${matchingPickings.length} ใบสั่งผลิตที่เปิดอยู่ — เลือกงานที่จะจ่าย:</p>
    ${matchingPickings.map((p, idx) => {
      const pct = p.plannedQty > 0 ? Math.min(100, Math.round((p.dispatchedQty / p.plannedQty) * 100)) : 0;
      const complete = p.dispatchedQty >= p.plannedQty;
      return `
      <div class="ticket" style="cursor:pointer;margin-bottom:10px;" onclick="selectPicking(${idx})">
        <div class="so-big">${p.so}</div>
        <div class="row"><span>ลูกค้า</span><span>${p.customer}</span></div>
        <div class="row"><span>จ่ายไปแล้ว</span><span>${p.dispatchedQty} / ${p.plannedQty}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${complete ? 'var(--green)' : 'var(--amber)'};"></div></div>
        ${remainingBadge(p.dispatchedQty, p.plannedQty)}
        <button class="btn-blue" style="margin-top:10px;" onclick="event.stopPropagation();selectPicking(${idx})">เลือกงานนี้</button>
      </div>
    `;
    }).join('')}
  `;
  ticket.classList.remove('hidden');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('preview').classList.add('hidden');
}

function selectPicking(idx){
  const data = matchingPickings[idx];
  if(!data) return;
  currentPicking = data;
  const ticket = document.getElementById('pickingTicket');
  const scanCard = document.getElementById('scanCard');
  const pct = data.plannedQty > 0 ? Math.min(100, Math.round((data.dispatchedQty / data.plannedQty) * 100)) : 0;
  const complete = data.dispatchedQty >= data.plannedQty;
  ticket.innerHTML = `
    <button class="btn-secondary" style="margin-bottom:10px;" onclick="renderPickingChoices()">← เลือกงานอื่น (${matchingPickings.length} ใบ)</button>
    <div class="ticket">
      <div class="row"><span>เครื่องพิมพ์</span><span>${data.printer}</span></div>
      <div class="row"><span>วันที่ผลิต</span><span>${data.productionDate}</span></div>
      <div class="so-big">${data.so}</div>
      <div class="row"><span>ลูกค้า</span><span>${data.customer}</span></div>
      <div class="row"><span>จำนวนที่ต้องผลิต</span><span>${data.plannedQty}</span></div>
      <div class="row"><span>จ่ายไปแล้ว</span><span>${data.dispatchedQty} (${pct}%)</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${complete ? 'var(--green)' : 'var(--amber)'};"></div></div>
      ${remainingBadge(data.dispatchedQty, data.plannedQty)}
    </div>
  `;
  ticket.classList.remove('hidden');
  scanCard.classList.remove('hidden');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('preview').classList.add('hidden');
}

async function refreshCurrentPicking(){
  // เรียกหลังบันทึกจ่ายสำเร็จ เพื่ออัปเดตยอดสะสมของ "ทุกใบ" ที่เคยค้นเจอ แล้วกลับไปโชว์ใบที่กำลังจ่ายอยู่
  if(!currentPicking) return;
  const printer = document.getElementById('sPrinter').value;
  const date = document.getElementById('sDate').value;
  try{
    const data = await apiGet({action:'getPickingForPrinterDate', printer, date});
    matchingPickings = data.pickings || [];
    const idx = matchingPickings.findIndex(p => p.pickingId === currentPicking.pickingId);
    if(idx >= 0){ selectPicking(idx); }
    else { renderPickingChoices(); }
  }catch(e){ /* เงียบไว้ ไม่รบกวน flow หลัก */ }
}

function compressImage(file, maxDim=700, quality=0.55){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhotoSelected(event){
  const file = event.target.files[0];
  if(!file || !currentPicking) return;
  const preview = document.getElementById('preview');
  preview.src = URL.createObjectURL(file);
  preview.classList.remove('hidden');
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('scanMsg').innerHTML = `<div class="msg ok"><span class="spinner"></span>กำลังอ่านป้าย...</div>`;

  try{
    const base64 = await compressImage(file);
    const res = await apiPost({action:'analyzeTag', imageBase64: base64});
    document.getElementById('scanMsg').innerHTML = '';
    if(res.error){
      const debugStr = res.debug ? `<br><span style="font-size:.7rem;opacity:.7;">debug: ${JSON.stringify(res.debug)}</span>` : '';
      document.getElementById('resultArea').innerHTML = `<div class="msg err">${res.error}${debugStr}</div>`;
      return;
    }
    renderResult(res);
  }catch(e){
    document.getElementById('scanMsg').innerHTML = `<div class="msg err">อ่านป้ายไม่สำเร็จ: ${e.message}</div>`;
  }
}

function renderResult(read){
  const expected = currentPicking.so.trim().toUpperCase();
  const got = (read.so || '').trim().toUpperCase();
  const match = expected === got;
  const area = document.getElementById('resultArea');

  area.innerHTML = `
    <div class="result-banner ${match?'pass':'fail'}">
      <div class="big">${match ? '✅ ถูกต้อง' : '❌ จ่ายผิด SO'}</div>
      <div class="small">อ่านได้: ${got || '(อ่านไม่ออก)'} · ต้องการ: ${expected}</div>
    </div>
    ${match ? `
      <label>จำนวนที่จ่าย (แก้ไขได้)</label>
      <input type="number" id="dispatchQty" value="${read.qty || ''}">
      <button class="btn-green" onclick="confirmDispatch()">ยืนยันบันทึกจ่าย</button>
    ` : `
      <button class="btn-secondary" onclick="resetScan()">สแกนใหม่</button>
    `}
  `;
}

function resetScan(){
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('preview').classList.add('hidden');
  document.getElementById('photoInput').value = '';
}

async function confirmDispatch(){
  const qty = document.getElementById('dispatchQty').value;
  const staffName = document.getElementById('sStaffName').value;
  const body = {
    action:'recordDispatch',
    pickingId: currentPicking.pickingId,
    printer: currentPicking.printer,
    productionDate: currentPicking.productionDate,
    soExpected: currentPicking.so,
    soRead: currentPicking.so,
    qty, staffName
  };
  try{
    await apiPost(body);
    await refreshCurrentPicking(); // รีเฟรชยอดสะสม และกลับไปโชว์ใบเดิมที่กำลังจ่ายอยู่
    resetScan();
  }catch(e){
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  }
}

loadPrinters();
loadOpenPickings();
</script>
